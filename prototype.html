<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annotated prototype · Cleartrip, planned together</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><b>Cleartrip, planned together</b><nav><a href="index.html">Overview</a><a href="docs.html">Documentation</a><a href="docs.html#09-plan-together">User flows</a><a class="on" href="prototype.html">Annotated prototype</a></nav></header>
<div class="pp">
  <aside class="rail" id="rail" aria-label="Steps"></aside>
  <section class="stagewrap">
    <div class="bar"><div class="seg" role="group" aria-label="Device"><button id="bd" class="on">Desktop</button><button id="bp">Phone</button></div>
      <span style="font-size:13px;color:#6b6b72">This is the live app. Click inside it to try things.</span><a id="open" target="_blank" rel="noopener">Open full screen ↗</a></div>
    <div class="stage" id="stage"><div class="scaler" id="scaler"><iframe id="fr" title="Prototype"></iframe><div class="pins" id="pins"></div></div></div>
  </section>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>
<script>
const APP='https://rushabhm-blip.github.io/Cleartrip_ai_agent/';
/* h = viewport height used for the desktop view; pins are in 1440-wide page coordinates */
const G=[
['SET UP',[
 {id:'setup',j:'setup',h:960,tag:'GROUP',t:'One screen for crew, place, dates and budget',see:'Friends join shoulder to shoulder. Place, dates and budget per person sit beside an assistant.',why:'5 of 9 people who planned for four or more described chasing, waiting or redoing work. Starting from shared facts (who is going, how much each can spend) keeps the plan from drifting later.',
  pins:[[84,352,'The crew','Each friend gets a character. Naming someone is not inviting them, and joining is not approving costs.'],[770,306,'Not sure where?','“Find me a place” turns five preferences into three sample matches.'],[1000,463,'Still deciding together?','Starts a Wishbox where everyone adds wishes first.'],[1398,735,'Assistant','Quick prompts replace an empty chat box.']]},
 {id:'discover',j:'discover',h:960,tag:'GROUP',t:'Find me a place',see:'Leaving from, dates, budget and five moods. A short globe animation, then up to three matches.',why:'6 of 9 get overwhelmed by too many reels, blogs and apps. A short list with a reason and an honest estimate beats browsing. Matching is a local demo, so prices are labelled as samples.'},
 {id:'discover-results',j:'discover-results',h:960,tag:'GROUP',t:'Three matches, with reasons',see:'Each card shows the place, why it fits, travel time and an estimate per person.',why:'The list is filtered by dates, travel time and budget before it is ranked. If nothing fits, it says which single change would help, and keeps your preferences.'}]],
['DECIDE TOGETHER',[
 {id:'wishbox',j:'wishbox',h:960,tag:'GROUP',t:'Wishbox: add wishes',see:'Drag a sticker into the box, or write your own wish.',why:'Different budgets and tastes are rarely said out loud. Collecting wishes one by one, in a shared box, lets quieter people speak first.'},
 {id:'review',j:'review',h:960,tag:'GROUP',t:'Coordinator review',see:'Who is ready, and the wishes grouped into themes by AI.',why:'The AI groups wishes but never deletes unusual ones, so minority wishes survive. The coordinator stays in charge of what goes forward.'},
 {id:'reveal',j:'reveal',h:960,tag:'GROUP',t:'Reveal the shortlist',see:'A globe introduces the options. Skip animation is always there.',why:'A little ceremony makes the shortlist feel shared. The globe does not choose; it only shows.'},
 {id:'vote',j:'vote',h:960,tag:'GROUP',t:'Like or Pass',see:'Everyone votes on each option, then sees tallies.',why:'Liking a place is not approving its cost, and a missing vote is never counted as Pass. Caps can stay private.'}]],
['TALK TO THE AI',[
 {id:'chat',j:'chat',h:960,tag:'CONVERSATION',t:'One short question, not a form',see:'The AI asks about the mood of the trip and offers chips.',why:'People describe trips in their own words. Asking one thing at a time feels like a conversation, and the limits you gave are restated so nobody has to repeat them.'},
 {id:'building',j:'building',h:960,tag:'TRANSPARENCY',t:'Watch it think',see:'Checks complete one by one while the plan builds.',why:'6 of 9 had tried an AI planner and all hit a problem. Showing the work, with a Stop button, makes the plan inspectable. Counts are simulated in the prototype.',
  pins:[[612,382,'One question','Answers can be chips or free text.'],[612,592,'Limits restated','“Planning target: ₹10,200 / person” is said back.'],[612,714,'Visible checks','Compared stays, checked buses, fitting sights into opening hours.']]}]],
['REVIEW AND CONTROL',[
 {id:'plan',j:'plan',h:1400,tag:'CONTROL',t:'One plan, with totals beside it',see:'Days, a route, totals by stay, transport and meals, and a per-person or group toggle.',why:'6 of 9 check the total price first. Keeping totals and the split next to the plan answers “what will I spend?” without arithmetic.',
  pins:[[1402,228,'Cap breached?','It says so and offers a cheaper stay.'],[1402,330,'Totals','Per person and group, split by category.'],[1402,525,'Day by day','Pick a day to read and edit it.'],[838,742,'Overpacked','11 h planned in 8 h 30. A fix is offered, never forced.']]},
 {id:'why',j:'why',h:1400,tag:'TRANSPARENCY',t:'Why this plan',see:'Reasons in plain words, the trade-off, and an alternative with its saving.',why:'8 of 9 said yes to one plan with plain reasons. The trade-off is stated, not hidden, and an alternative sits right beside it.',
  pins:[[388,846,'Reasons','Short, specific reasons.'],[950,838,'Trade-off','₹300 above the lowest cap, stated plainly.'],[950,936,'Alternative','Boulder View saves ₹300 per person.']]},
 {id:'timefix',j:'timefix',h:1400,tag:'CONTROL',t:'Fix an overpacked day',see:'Before and after for Day 2, with the proposed move.',why:'AI plans often fit too much in a day. The fix is previewed on both days and only applied on request: warn, preview, apply, undo.'},
 {id:'stay',j:'stay',h:1400,tag:'CONTROL',t:'Compare and swap a stay',see:'Two stays side by side with a night-by-night breakdown.',why:'Swapping one piece should not mean starting over. The saving (₹300 per person) is stated and the new total is shown before you commit.'}]],
['AGREE AND HAND OFF',[
 {id:'shared',j:'shared',h:1400,tag:'GROUP',t:'Share the draft for approval',see:'Each traveller’s status: approved, waiting, or over their cap.',why:'A shared plan is not a shared agreement. Each person approves the same version, and the cap breach is visible to everyone.'},
 {id:'approved',j:'approved',h:1400,tag:'GROUP',t:'Everyone approved',see:'The final plan, cost summary and the Review and book button unlocked.',why:'Review and book stays disabled until all approve. Any change to itinerary, price, dates or caps asks again.'},
 {id:'handoff',j:'handoff',h:960,tag:'GROUP',t:'Hand off to checkout',see:'Items for checkout are separate from local transport and food estimates.',why:'The prototype stops before payment. Nothing is booked here, and estimates are not mixed with items you can actually buy.'}]],
['WHEN THINGS GO WRONG',[
 {id:'price',j:'price',h:1400,tag:'EDGE CASE',t:'The price changes mid-booking',see:'A stay rises by ₹150 and breaks Prathmesh’s cap.',why:'Prices move. The cap is never bypassed: the group is asked to approve again, with alternatives offered first.'},
 {id:'nomatch',j:'nomatch',h:1400,tag:'EDGE CASE',t:'Nothing fits the budget',see:'“No complete plan fits ₹9,500”, with three ways forward.',why:'No dead end. The closest option and the gap are shown, and the saved plan is never overwritten.'},
 {id:'error',j:'error',h:1400,tag:'EDGE CASE',t:'A search fails',see:'Trip details are saved. Try again or edit.',why:'Errors should keep what people entered. The spinner never runs forever, and there is always a way back.'}]]
];
const steps=G.flatMap(g=>g[1]);let cur=0,dev='desktop';
const $=id=>document.getElementById(id),fr=$('fr'),sc=$('scaler'),stage=$('stage'),pins=$('pins');
$('rail').innerHTML=G.map(g=>'<h3>'+g[0]+'</h3>'+g[1].map(s=>'<button data-i="'+steps.indexOf(s)+'"><i>'+(steps.indexOf(s)+1)+'</i>'+s.t.split(':')[0].slice(0,34)+'</button>').join('')).join('');
function size(){const w=dev==='phone'?390:1440,h=dev==='phone'?844:steps[cur].h;const avail=stage.parentElement.clientWidth-44;const maxW=dev==='phone'?420:avail;const k=Math.min(1,maxW/w);
  fr.style.width=w+'px';fr.style.height=h+'px';pins.style.width=w+'px';pins.style.height=h+'px';sc.style.transform='scale('+k+')';stage.style.width=w*k+'px';stage.style.height=h*k+'px';return k;}
function show(i,keep){cur=i;const s=steps[i];if(!keep)history.replaceState(null,'','#'+s.id);
  document.querySelectorAll('#rail button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  fr.src=APP+'?jump='+s.j;$('open').href=APP+'?jump='+s.j;size();
  const P=dev==='desktop'?(s.pins||[]):[];pins.innerHTML=P.map((p,n)=>'<button class="pin" data-n="'+n+'" style="left:'+p[0]+'px;top:'+p[1]+'px" aria-label="Note '+(n+1)+'">'+(n+1)+'</button>').join('');
  $('notes').innerHTML='<span class="tag">'+s.tag+'</span><h2>'+s.t+'</h2><h4>WHAT YOU SEE</h4><p>'+s.see+'</p><h4>WHY IT IS DESIGNED THIS WAY</h4><p>'+s.why+'</p>'+
   (P.length?'<h4>ANNOTATIONS</h4><ol>'+P.map((p,n)=>'<li data-n="'+n+'"><b>'+(n+1)+'</b><span><strong style="font-weight:600">'+p[2]+'.</strong> '+p[3]+'</span></li>').join('')+'</ol>':'')+
   '<div class="nav2"><button id="pv" '+(i===0?'disabled':'')+'>← Back</button><button class="p" id="nx" '+(i===steps.length-1?'disabled':'')+'>Next →</button></div>'+
   '<p class="hint">Step '+(i+1)+' of '+steps.length+'. Numbered pins mark spots on desktop. Prices, places and AI replies are samples.</p>';
  $('pv').onclick=()=>show(i-1);$('nx').onclick=()=>show(i+1);}
function hl(n){document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',+p.dataset.n===n));document.querySelectorAll('.notes li').forEach(l=>l.classList.toggle('on',+l.dataset.n===n));}
document.addEventListener('click',e=>{const b=e.target.closest('#rail button');if(b)return show(+b.dataset.i);const p=e.target.closest('.pin,.notes li');if(p)hl(+p.dataset.n);});
$('bd').onclick=()=>{dev='desktop';$('bd').classList.add('on');$('bp').classList.remove('on');show(cur,1)};$('bp').onclick=()=>{dev='phone';$('bp').classList.add('on');$('bd').classList.remove('on');show(cur,1)};
addEventListener('resize',size);
const h=location.hash.slice(1);const i0=steps.findIndex(s=>s.id===h);show(i0>=0?i0:0);
</script></body></html>
